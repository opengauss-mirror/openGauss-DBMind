# macOS-specific metric mappings
# This file handles the differences between Linux and macOS node_exporter metrics
# Only loaded when running on macOS

# Memory metrics - macOS uses different naming
node_memory_MemTotal_bytes = node_memory_total_bytes
node_memory_MemAvailable_bytes = node_memory_free_bytes
node_memory_SwapTotal_bytes = node_memory_swap_total_bytes
node_memory_SwapFree_bytes = node_memory_swap_total_bytes
node_memory_Buffers_bytes = node_memory_internal_bytes
node_memory_Cached_bytes = node_memory_inactive_bytes