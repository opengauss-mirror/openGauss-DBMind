# Metric mapping patch for DBMind
# This file maps DBMind expected metric names to actual opengauss_exporter metric names

# Connection metrics
gaussdb_total_connection = sum(pg_stat_activity_count)
gaussdb_active_connection = pg_stat_activity_count{state="active"}
gaussdb_idle_connection = pg_stat_activity_count{state="idle"}
pg_connections_active = pg_stat_activity_count{state="active"}
pg_connections_idle = pg_stat_activity_count{state="idle"}  
pg_connections_total = sum(pg_stat_activity_count)
pg_connections_waiting = pg_stat_activity_count{state="waiting"}
pg_connections_idle_in_transaction = pg_stat_activity_count{state="idle in transaction"}

# Transaction metrics
pg_transactions_commit = pg_db_xact_commit
pg_transactions_rollback = pg_db_xact_rollback
pg_transactions_running = pg_stat_activity_count{state="active"}

# Performance metrics
pg_cache_hit_ratio = pg_db_blks_hit / (pg_db_blks_hit + pg_db_blks_read)
pg_database_size = pg_database_size_bytes
pg_locks_count = pg_db_confl_lock
pg_deadlocks_count = pg_db_deadlocks

